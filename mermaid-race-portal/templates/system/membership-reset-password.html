{% extends "./../layouts/base.html" %}
{% block body %}
<section style="min-height: calc(100vh - var(--header-height)); background: var(--color-gray-50); display: flex; align-items: center; padding: 3rem 0;">
  <div class="container" style="max-width: 440px;">
    <div style="background: var(--color-white); border-radius: var(--border-radius-xl); box-shadow: var(--shadow-lg); padding: 2.5rem; text-align: center; border: 1px solid var(--color-gray-100);">
      <h1 style="font-size: 1.5rem; margin-bottom: .5rem;">Reset Your Password</h1>
      <p style="color: var(--color-gray-500); margin-bottom: 2rem;">Enter your new password below.</p>
      {% membership_reset_password_form %}
    </div>
  </div>
</section>
{% endblock %}
